apiVersion: apps/v1
kind: Deployment 
metadata:
  name: weather-app-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app : weather-app
  template:
    metadata:
      labels:
        app: weather-app
    spec:
      containers:
        - name: weather-app-container
          image: essamkhedr/weatherapp:2.0
          ports:
           - containerPort: 80
---
apiVersion: v1
kind: Service 
metadata:
  name: weather-app-svc
spec:
  selector: 
    app: weather-app
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
  